<!-- Intrinsic size is 512 so Quick Look renders it full-canvas; geometry stays on a 128 grid. -->
<svg width="512" height="512" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252d3d"/>
      <stop offset="1" stop-color="#10131a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- send chevron: code leaving the editor -->
  <path d="M24 40 L44 64 L24 88" fill="none" stroke="#4FC3F7" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52 64 H70" stroke="#4FC3F7" stroke-width="8" stroke-linecap="round"/>

  <!-- operator chain: the TD node network receiving it -->
  <path d="M79 36 V92" stroke="#5b6478" stroke-width="5" stroke-linecap="round"/>
  <rect x="70" y="26" width="34" height="20" rx="5" fill="#F2C744"/>
  <rect x="70" y="54" width="34" height="20" rx="5" fill="#F2C744"/>
  <rect x="70" y="82" width="34" height="20" rx="5" fill="#F2C744"/>
</svg>
